[package]
name = "aegis-core"
version = "0.26.1"
edition = "2021"
rust-version = "1.92"

[features]
default = []
native-dialogs = ["dep:rfd"]
file-dialog = ["native-dialogs"]
linux-lifecycle = ["dep:zbus", "dep:futures-lite", "dep:async-io"]
native-desktop = ["dep:wry", "dep:winit", "dep:webkit6", "dep:gtk4"]

[dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
arboard = { version = "3.7.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = { version = "0.12", path = "vendor/tiny_http" }
sha2 = "0.10"
wasmi = "0.46"
ed25519-dalek = "2"
hex = "0.4"
getrandom = "0.2"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
wat = "1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "0.57.1", default-features = false, optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.1", default-features = false, features = ["default-rt", "proxy"], optional = true }
futures-lite = { version = "2.6", optional = true }
async-io = { version = "2.6", optional = true }
webkit6 = { version = "0.6.1", optional = true }
gtk4 = { version = "0.11.5", features = ["v4_10"], optional = true }
