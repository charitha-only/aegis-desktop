[package]
name = "aegis-core"
version = "0.25.3"
edition = "2021"
rust-version = "1.89"

[features]
default = []
native-desktop = ["dep:wry", "dep:winit", "dep:webkit6", "dep:gtk4"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
sha2 = "0.10"
wasmi = "0.46"
ed25519-dalek = "2"
hex = "0.4"
getrandom = "0.2"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
wat = "1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "0.57.1", default-features = false, optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit6 = { version = "0.6.1", optional = true }
gtk4 = { version = "0.11.5", features = ["v4_10"], optional = true }
