name: Portable core and UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    name: Core and UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test shared behavior on the native runner
        run: cargo test --locked --manifest-path src-core/Cargo.toml
      - name: Build optimized core
        run: cargo build --release --locked --manifest-path src-core/Cargo.toml
      - name: Verify real native platform IPC and storage
        run: node aegis-cli/bin/portable-smoke.js
      - run: npm ci --prefix src-ui
      - name: Typecheck and build UI
        run: npm --prefix src-ui run build
