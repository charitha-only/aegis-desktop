name: Portable core and UI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Core and UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test shared behavior on the native runner
        run: cargo test --locked --manifest-path src-core/Cargo.toml
      - name: Build optimized core
        run: cargo build --release --locked --manifest-path src-core/Cargo.toml
      - name: Verify signed offline metadata and staged native artifact bytes
        run: node aegis-cli/bin/update-verification-smoke.js
      - name: Verify real bounded filesystem exhaustion and update staging recovery
        if: matrix.os == 'ubuntu-latest'
        run: node aegis-cli/bin/update-filesystem-fault-smoke.js
      - name: Verify real native platform IPC and storage
        run: node aegis-cli/bin/portable-smoke.js
      - name: Verify packaged identity survives rename and invalid IDs fail closed
        run: node aegis-cli/bin/identity-smoke.js
      - name: Verify packaged dynamic-port and development launch targets without a GUI
        run: node aegis-cli/bin/launch-plan-smoke.js
      - name: Verify incomplete IPC requests have bounded transport lifetimes
        run: node aegis-cli/bin/ipc-deadline-smoke.js
      - name: Test CLI and benchmark interfaces
        run: node --test aegis-cli/test/doctor.test.js aegis-cli/test/package-command.test.js aegis-cli/test/metrics.test.js aegis-cli/test/create.test.js aegis-cli/test/bridge-origin.test.js aegis-cli/test/development.test.js aegis-cli/test/benchmark-core.test.js aegis-cli/test/package-integrity.test.js aegis-cli/test/debian-package.test.js aegis-cli/test/macos-package.test.js aegis-cli/test/update-verification.test.js aegis-cli/test/update-staging.test.js aegis-cli/test/update-state.test.js
      - name: Verify explicit core performance budgets and raw evidence
        run: node aegis-cli/bin/benchmark-smoke.js
      - name: Record core performance measurements
        run: node aegis-cli/bin/benchmark.js > core-benchmark.json
      - name: Upload core performance measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-performance-${{ matrix.os }}
          path: core-benchmark.json
      - run: npm ci --prefix src-ui
      - name: Verify the TypeScript SDK against its configured native core
        run: node aegis-cli/bin/sdk-smoke.js
      - name: Verify owned development startup, restart, failure and shutdown
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-core/target
        run: node aegis-cli/bin/dev-smoke.js
      - name: Typecheck and build UI
        run: npm --prefix src-ui run build
      - name: Bundle and boot native portable runtime
        run: node aegis-cli/bin/package-smoke.js
      - name: Prepare native Debian packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xdg-utils
      - name: Verify Debian install upgrade removal and vault preservation
        if: matrix.os == 'ubuntu-latest'
        run: node aegis-cli/bin/debian-package-smoke.js
      - name: Verify macOS package install upgrade removal and vault preservation
        if: matrix.os == 'macos-latest'
        run: node aegis-cli/bin/macos-package-smoke.js
      - name: Create and build a clean application template
        run: node aegis-cli/bin/scaffold-smoke.js
