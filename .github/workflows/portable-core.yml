name: Portable core and UI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Core and UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test shared behavior on the native runner
        run: cargo test --locked --manifest-path src-core/Cargo.toml
      - name: Build optimized core
        run: cargo build --release --locked --manifest-path src-core/Cargo.toml
      - name: Verify real native platform IPC and storage
        run: node aegis-cli/bin/portable-smoke.js
      - name: Verify packaged identity survives rename and invalid IDs fail closed
        run: node aegis-cli/bin/identity-smoke.js
      - name: Verify incomplete IPC requests have bounded transport lifetimes
        run: node aegis-cli/bin/ipc-deadline-smoke.js
      - name: Test CLI and benchmark interfaces
        run: node --test aegis-cli/test/metrics.test.js aegis-cli/test/create.test.js
      - name: Record core performance measurements
        run: node aegis-cli/bin/benchmark.js > core-benchmark.json
      - name: Upload core performance measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-performance-${{ matrix.os }}
          path: core-benchmark.json
      - run: npm ci --prefix src-ui
      - name: Typecheck and build UI
        run: npm --prefix src-ui run build
      - name: Bundle and boot native portable runtime
        run: node aegis-cli/bin/package-smoke.js
      - name: Create and build a clean application template
        run: node aegis-cli/bin/scaffold-smoke.js
