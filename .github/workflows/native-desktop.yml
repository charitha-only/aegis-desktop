name: Optional native desktop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install GTK4 and WebKit6 development libraries
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus-x11 at-spi2-core apparmor zenity xdotool
      - name: Permit sandbox namespaces for the owned Linux fixture executable
        if: runner.os == 'Linux'
        run: bash scripts/setup-linux-native-ci.sh
      - name: Compile and test native feature without opening a desktop window
        run: cargo test --locked --manifest-path src-core/Cargo.toml --features native-desktop,file-dialog
      - name: Build native debug runtime for GUI fixture
        run: cargo build --locked --manifest-path src-core/Cargo.toml --features native-desktop,file-dialog
      - name: Reject malformed file picker helper input without opening a dialog
        run: node aegis-cli/bin/file-dialog-smoke.js
      - name: Open and acknowledge owned Linux message fixture in virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node aegis-cli/bin/message-dialog-smoke.js
      - name: Native clipboard roundtrip on disposable desktop
        if: runner.os != 'Linux'
        run: cargo test --locked --manifest-path src-core/Cargo.toml --features native-desktop,file-dialog -- --ignored --exact security::regression_tests::ipc_clipboard_roundtrip_on_disposable_runner
      - name: Native X11 clipboard roundtrip in virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --manifest-path src-core/Cargo.toml --features native-desktop,file-dialog -- --ignored --exact security::regression_tests::ipc_clipboard_roundtrip_on_disposable_runner
      - name: Boot actual native window and close after fixture loads
        if: runner.os != 'Linux'
        run: node aegis-cli/bin/native-smoke.js
      - name: Boot actual GTK4 window in disposable virtual display
        if: runner.os == 'Linux'
        env:
          TMPDIR: /tmp
        run: xvfb-run -a dbus-run-session -- node aegis-cli/bin/native-smoke.js
      - name: Remove the disposable fixture namespace profile
        if: always() && runner.os == 'Linux'
        run: |
          if [ -f "$RUNNER_TEMP/aegis-native-userns.profile" ]; then
            sudo apparmor_parser -R "$RUNNER_TEMP/aegis-native-userns.profile"
          fi
